<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sentinela GeoIA">
  <style>
    .tile { fill: #0f5365; }
    .sweep { stroke: #0f5365; }
    .glyph { stroke: #ffffff; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #b4c5ff; }
      .sweep { stroke: #b4c5ff; }
      .glyph { stroke: #0a0a0a; }
      .dot { fill: #0a0a0a; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <circle class="glyph" cx="16" cy="16" r="10.5" fill="none" stroke-width="3" />
  <line class="sweep" x1="16" y1="16" x2="27" y2="27" stroke-width="6" stroke-linecap="round" />
  <line class="glyph" x1="16" y1="16" x2="24.4" y2="24.4" stroke-width="3" stroke-linecap="round" />
  <circle class="dot" cx="16" cy="16" r="3" />
</svg>
