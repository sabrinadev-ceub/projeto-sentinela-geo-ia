<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Sentinela GeoIA</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Monitoramento geo-hidrológico em tempo real com IA explicável (XAI/SHAP) e alerta antecipado à Defesa Civil, alinhado à Meta 2.2.4 do PN-PDC 2025-2035."
    />
    <meta name="theme-color" content="#f4f5f5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <script>
      try {
        var raw = localStorage.getItem('sentinela:v1:theme');
        var choice = raw ? JSON.parse(raw) : 'dark';
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) {
          document.querySelector('meta[name="theme-color"]').content = '#0a0a0a';
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
